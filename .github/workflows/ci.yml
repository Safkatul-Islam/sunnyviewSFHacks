name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Unit and route tests with coverage gate
        run: npm run test:coverage
      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  segmenter:
    name: Segmenter tests and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/segmenter/requirements.txt
      - run: pip install -r services/segmenter/requirements.txt
      - run: python -m unittest discover -s services/segmenter/tests
      - name: Build image
        run: docker build -t sunnyview-segmenter services/segmenter
      - name: Smoke test /healthz
        run: |
          docker run -d --name segmenter -p 127.0.0.1:8000:8000 sunnyview-segmenter
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs segmenter
          exit 1
